<style>
/* Layout: a school "case board" — top bar with clock, room scene + dialogue on the left, school map + notebook on the right; stacks on phones. */
:root {
  --bg: #eef3fb;
  --paper: #ffffff;
  --ink: #14213d;
  --muted: #5a6788;
  --line: #cfd9ec;
  --marker: #ffc93c;
  --marker-ink: #3a2a00;
  --string: #e63946;
  --good: #1f8a70;
  --sel: #dfe9ff;
  --common: #7d8aa8;
  --rare: #2f6bff;
  --legend: #d99a00;
  --god: #c2187a;
  --shadow: 0 2px 0 #14213d;
  --f-display: "Bungee", "Arial Black", Impact, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --f-note: "Special Elite", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1424; --paper: #172138; --ink: #e8eef9; --muted: #9aa8c7; --line: #2a3756;
    --marker: #ffcf4d; --marker-ink: #2b1f00; --string: #ff5d68; --good: #3cc69c; --sel: #22325a;
    --common: #8f9bb8; --rare: #6b95ff; --legend: #f2b632; --god: #ff4fb0; --shadow: 0 2px 0 #000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1424; --paper: #172138; --ink: #e8eef9; --muted: #9aa8c7; --line: #2a3756;
  --marker: #ffcf4d; --marker-ink: #2b1f00; --string: #ff5d68; --good: #3cc69c; --sel: #22325a;
  --common: #8f9bb8; --rare: #6b95ff; --legend: #f2b632; --god: #ff4fb0; --shadow: 0 2px 0 #000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
#app {
  max-width: 1180px;
  margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: clamp(2.4rem, 8vw, 4.6rem); }
h2 { font-size: clamp(1.3rem, 3.4vw, 1.9rem); }
h3 { font-size: 1.05rem; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--rare); outline-offset: 2px; }
.label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.panel {
  background: var(--paper); border: 2px solid var(--ink); border-radius: 14px;
  box-shadow: var(--shadow); padding: 18px; min-width: 0;
}
.btn {
  border: 2px solid var(--ink); border-radius: 10px; background: var(--paper);
  padding: 10px 16px; font-weight: 700; box-shadow: var(--shadow);
  transition: transform .08s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.primary { background: var(--marker); color: var(--marker-ink); }
.btn.danger { background: var(--string); color: #fff; }
.btn.small { padding: 6px 10px; font-size: .85rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

/* top bar */
.topbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-size: 1.1rem; }
.brand span { color: var(--string); }
.lang { display: inline-flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; background: var(--paper); }
.lang button { border: 0; background: transparent; padding: 5px 12px; font-weight: 700; font-size: .85rem; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.stat { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* home */
.hero { display: grid; gap: 14px; padding-block: 10px; }
.hero h1 span { color: var(--string); }
.tag { font-family: var(--f-note); font-size: 1.15rem; color: var(--muted); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.mode { text-align: left; display: grid; gap: 8px; padding: 20px; border: 2px solid var(--ink); border-radius: 14px; box-shadow: var(--shadow); background: var(--paper); }
.mode:hover { background: var(--sel); }
.mode .big { font-family: var(--f-display); font-size: 1.7rem; }
.mode.hard .big { color: var(--string); }
.mode .pts { font-family: var(--f-note); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.how { display: grid; gap: 10px; margin: 0; padding-left: 1.2em; }
.me { display: flex; gap: 14px; align-items: center; }

/* avatars */
.av {
  flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  font-size: 1.6rem; border: 3px solid var(--common); background: var(--bg); font-family: var(--f-display);
}
.av.letter { font-size: 1.35rem; color: #fff; background: #44506d; }
.av.r-rare { border-color: var(--rare); }
.av.r-legendary { border-color: var(--legend); }
.av.r-god { border-color: var(--god); box-shadow: 0 0 0 3px color-mix(in srgb, var(--god) 30%, transparent); }
.av.lg { width: 72px; height: 72px; font-size: 2.2rem; }

/* game */
.gamehead { display: grid; gap: 10px; }
.clock { font-family: var(--f-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.timebar { height: 12px; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; background: var(--paper); }
.timebar > i { display: block; height: 100%; background: var(--good); transition: width .3s ease; }
.timebar.low > i { background: var(--string); }
.board { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.col { display: grid; gap: 18px; min-width: 0; }
@media (max-width: 860px) { .board { grid-template-columns: 1fr; } }
.roomhead { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.roomicon { font-size: 2.6rem; line-height: 1; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.person { border: 2px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; align-content: start; background: var(--bg); }
.person.active { border-color: var(--ink); }
.person .who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.person .nm { font-weight: 700; line-height: 1.2; }
.person .role { font-size: .78rem; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.t { font-size: .75rem; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 8px; display: inline-flex; gap: 5px; align-items: center; }
.sw { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--ink); display: inline-block; }
.bubble {
  position: relative; background: var(--paper); border: 2px solid var(--ink); border-radius: 14px;
  padding: 16px 18px; box-shadow: var(--shadow); font-family: var(--f-note); font-size: 1.12rem; display: grid; gap: 6px;
}
.bubble .spk { font-family: var(--f-body); font-weight: 700; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.bubble.empty { color: var(--muted); }
.flash { border: 2px solid var(--string); background: color-mix(in srgb, var(--string) 12%, var(--paper)); border-radius: 12px; padding: 10px 14px; font-weight: 500; }
.flash.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--paper)); }
.map { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.tile {
  text-align: left; border: 2px solid var(--ink); border-radius: 10px; background: var(--bg);
  padding: 8px 10px; display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center; min-width: 0;
}
.tile:hover { background: var(--sel); }
.tile .ic { font-size: 1.4rem; grid-row: span 2; }
.tile .n { font-weight: 700; font-size: .88rem; line-height: 1.2; overflow-wrap: anywhere; }
.tile .c { font-size: .72rem; color: var(--muted); }
.tile.here { background: var(--marker); color: var(--marker-ink); cursor: default; }
.tile.here .c { color: var(--marker-ink); }
.tile.sniff { border-color: var(--god); border-style: dashed; }
.notes { display: grid; gap: 8px; margin-top: 10px; font-family: var(--f-note); }
.note { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.note b { font-family: var(--f-display); font-weight: 400; color: var(--string); }
.note:last-child { border-bottom: 0; }

/* screens */
.center { display: grid; gap: 16px; justify-items: start; max-width: 680px; }
.casecard { border-left: 8px solid var(--string); }
.caseicon { font-size: 3rem; line-height: 1; }
.stamp {
  display: inline-block; font-family: var(--f-display); font-size: 1.4rem; padding: 6px 14px; border: 4px solid var(--good);
  color: var(--good); border-radius: 8px; transform: rotate(-4deg);
}
.stamp.bad { border-color: var(--string); color: var(--string); }

/* characters */
.chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.char { border: 2px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; background: var(--paper); align-content: start; }
.char.sel { border-color: var(--ink); background: var(--sel); }
.char.locked { opacity: .6; }
.char.locked .av { filter: grayscale(1); }
.rar { font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.rar.r-common, .rar.r-start { color: var(--common); }
.rar.r-rare { color: var(--rare); }
.rar.r-legendary { color: var(--legend); }
.rar.r-god { color: var(--god); }
.perk { font-size: .82rem; color: var(--muted); }
.box { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.boxart { font-size: 4rem; line-height: 1; }
.boxart.shake { animation: shake .5s ease; }
@keyframes shake { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-12deg)} 40%{transform:rotate(10deg)} 60%{transform:rotate(-8deg)} 80%{transform:rotate(6deg)} }
.meter { height: 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--god); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="app"></div>

// ---------- state ----------
const STORE = "hvem-var-det-v1";
let save = { points: 0, shards: 0, owned: ["rookie"], selected: "rookie", lang: "en" };
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s) save = Object.assign(save, s); } catch (e) {}
const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(save)); } catch (e) {} };
let ui = { screen: "home", run: null, result: null, flash: null, box: null };

const T = () => TX[save.lang] || TX.en;
const nameOf = id => id === "rookie" ? T().rookie : (T().roles[id] || id);
const locName = l => T().loc[l];
function fill(s, p) {
  return s.replace(/\{(\w+)\}/g, (m, k) => {
    if (k === "color") return T().colors[p.color];
    if (k === "acc") return T().accs[p.acc];
    if (k === "shoes") return T().shoes[p.shoes];
    if (k === "loc") return locName(p.loc);
    if (k === "riddle") return T().riddle[p.loc];
    if (k === "name") return nameOf(p.name);
    if (p[k] !== undefined) return p[k];
    return m;
  });
}
const line = p => { let s = T().lines[p.k]; if (Array.isArray(s)) s = s[p.i % s.length]; return fill(s, p); };
const tf = (k, p = {}) => fill(T()[k], p);

const cur = () => ui.run && ui.run.c;
const perk = () => rarityOf(save.selected);
const talkCost = () => ["legendary", "god"].includes(perk()) ? 5 : 10;
const walkCost = () => perk() === "god" ? 2 : 5;

// ---------- case generation ----------
function outfitFor(culprit, decoys, rest, mode) {
  const o = {};
  const other = (base, k) => { let v; do { v = pick(LISTS[k]); } while (v === base[k]); return v; };
  const rnd = () => ({ c: pick(COLORS), a: pick(ACCS), s: pick(SHOES) });
  const t = culprit === "Snute" ? null : rnd();
  if (t) o[culprit] = t;
  const keys = shuffle(["c", "a", "s"]);
  decoys.forEach((d, i) => {
    if (!t) { o[d] = rnd(); return; }
    const x = { ...t };
    if (mode === "hard") { const k = keys[i % 3]; x[k] = other(t, k); }
    else { x.c = other(t, "c"); x.a = pick(ACCS); x.s = pick(SHOES); }
    o[d] = x;
  });
  rest.forEach(d => {
    const x = rnd();
    if (t && x.c === t.c && x.a === t.a && x.s === t.s) x.c = other(t, "c");
    o[d] = x;
  });
  return o;
}

function newCase(id) {
  const me = save.selected, mode = ui.run.mode;
  const pool = THIEVES.filter(n => n !== me);
  const culprit = id === "cake" && me !== "Snute" && Math.random() < 0.25 ? "Snute" : pick(pool);
  const others = shuffle(pool.filter(n => n !== culprit));
  const nDecoy = mode === "hard" ? 2 : 1;
  const decoys = others.slice(0, nDecoy), rest = others.slice(nDecoy);
  const trail = shuffle(LOCS.filter(l => l !== "reception")).slice(0, 5);
  const people = {}; LOCS.forEach(l => people[l] = []);
  people[trail[4]] = shuffle([culprit, ...decoys]);
  const nonFinal = LOCS.filter(l => l !== trail[4]);
  rest.forEach(n => people[pick(nonFinal)].push(n));
  const snute = me !== "Snute" && culprit !== "Snute" && Math.random() < 0.6 ? pick(LOCS) : null;
  return {
    id, culprit, trail, people, snute,
    outfits: outfitFor(culprit, decoys, rest, mode),
    time: 0, limit: 360 + (perk() === "rare" ? 30 : 0),
    loc: "reception", talked: {}, found: [], said: null,
    seeds: Object.fromEntries([...THIEVES, ...LOCS].map(k => [k, rint(97)])),
  };
}

function trailLine(c, i) {
  const hard = ui.run.mode === "hard";
  const parts = [];
  if (i < 3) {
    if (c.culprit === "Snute") parts.push({ k: "dog" + i });
    else {
      const o = c.outfits[c.culprit];
      parts.push(i === 0 ? { k: "hint_c", color: o.c } : i === 1 ? { k: "hint_a", acc: o.a } : { k: "hint_s", shoes: o.s });
    }
    parts.push({ k: hard ? "next_hard" : "next_easy", loc: c.trail[i + 1] });
  } else {
    parts.push({ k: hard ? "final_hard" : "final_easy", loc: c.trail[4] });
  }
  return parts;
}

// ---------- actions ----------
function startRun(mode) {
  const ids = mode === "hard" ? shuffle(Object.keys(CASES)) : shuffle(["cake", "party", "friend"]);
  ui.run = { mode, ids, idx: 0, c: null };
  ui.run.c = newCase(ids[0]);
  ui.screen = "intro"; ui.flash = null;
  render();
}
function spend(m) { cur().time += m; }
function checkTime() {
  const c = cur();
  if (c.time >= c.limit) { ui.result = { ok: false, msg: tf("timeUp") }; ui.screen = "result"; }
}
function travel(loc) {
  const c = cur();
  if (loc === c.loc) return;
  spend(walkCost());
  if (c.talked.__dog) { delete c.talked.__dog; c.snute = Math.random() < 0.5 ? pick(LOCS.filter(l => l !== loc)) : null; }
  c.loc = loc; c.said = null; ui.flash = null;
  checkTime(); render();
}
function talk(pid) {
  const c = cur();
  ui.flash = null;
  if (c.talked[pid]) { c.said = { pid, parts: c.talked[pid] }; render(); return; }
  spend(talkCost());
  let parts;
  if (pid.startsWith("res:")) {
    const loc = pid.slice(4), i = c.trail.indexOf(loc);
    if (i >= 0 && i < 4) { parts = trailLine(c, i); if (!c.found.includes(i)) c.found.push(i); }
    else parts = [{ k: "noinfo", i: c.seeds[loc] }];
  } else if (pid === "__dog") {
    save.shards++;
    parts = [{ k: "snute", n: Math.min(save.shards, SHARDS_NEEDED) }];
    if (save.shards >= SHARDS_NEEDED && !save.owned.includes("Snute")) { save.owned.push("Snute"); ui.flash = { ok: true, msg: tf("snuteUnlocked") }; }
    persist();
  } else if (pid === "Snute") {
    parts = [{ k: "snuteGuilty" }];
  } else if (c.loc === c.trail[4]) {
    parts = [{ k: "nervous", i: c.seeds[pid] }];
  } else if (c.seeds[pid] % 3 === 0) {
    if (c.culprit === "Snute") parts = [{ k: "gossip_dog" }];
    else {
      const o = c.outfits[c.culprit], k = ["c", "a", "s"][c.seeds[pid] % 9 / 3 | 0];
      parts = [k === "c" ? { k: "gossip_c", color: o.c } : k === "a" ? { k: "gossip_a", acc: o.a } : { k: "gossip_s", shoes: o.s }];
    }
  } else parts = [{ k: "chat", i: c.seeds[pid] }];
  c.talked[pid] = parts;
  c.said = { pid, parts };
  checkTime(); render();
}
function accuse(name) {
  const c = cur();
  if (name === c.culprit) {
    const last = ui.run.idx + 1 >= ui.run.ids.length;
    ui.result = { ok: true, last };
    if (last) { const n = ui.run.mode === "hard" ? 2 : 1; save.points += n; persist(); ui.result.earned = n; }
    ui.screen = "result";
  } else if (ui.run.mode === "hard") {
    ui.result = { ok: false, msg: tf("wrongHard", { name }) }; ui.screen = "result";
  } else {
    spend(30); ui.flash = { ok: false, msg: tf("wrongEasy", { name }) }; checkTime();
  }
  render();
}
function nextCase() {
  ui.run.idx++; ui.run.c = newCase(ui.run.ids[ui.run.idx]);
  ui.screen = "intro"; ui.flash = null; render();
}
function openBox() {
  if (save.points < BOX_COST) { ui.box = { msg: tf("notEnough"), bad: true }; render(); return; }
  save.points -= BOX_COST;
  const roll = Math.random();
  const tier = roll < 0.55 ? "common" : roll < 0.85 ? "rare" : "legendary";
  const got = pick(CHARS.filter(c => c.r === tier)).id;
  let msg;
  if (save.owned.includes(got)) {
    save.shards += 2; msg = tf("boxDup", { name: got });
    if (save.shards >= SHARDS_NEEDED && !save.owned.includes("Snute")) { save.owned.push("Snute"); msg += " " + tf("snuteUnlocked"); }
  } else { save.owned.push(got); msg = tf("boxGot", { name: got }); }
  persist();
  ui.box = { msg, got, shake: true };
  render();
}
function choose(id) { if (save.owned.includes(id)) { save.selected = id; persist(); render(); } }
function setLang(l) { save.lang = l; persist(); document.documentElement.lang = l === "no" ? "no" : "en"; render(); }

// ---------- views ----------
function avatar(id, cls = "") {
  const r = rarityOf(id);
  if (id === "Snute" || id === "__dog") return `<div class="av r-god ${cls}" aria-hidden="true">🐕</div>`;
  if (ROLE_ICON[id]) return `<div class="av r-${r} ${cls}" aria-hidden="true">${ROLE_ICON[id]}</div>`;
  return `<div class="av letter r-${r} ${cls}" aria-hidden="true">${esc(id[0])}</div>`;
}
const langToggle = () => `<div class="lang" role="group" aria-label="Language">
  <button data-act="lang" data-v="en" aria-pressed="${save.lang === "en"}">EN</button>
  <button data-act="lang" data-v="no" aria-pressed="${save.lang === "no"}">NO</button></div>`;
const stats = () => `<span class="stat" title="${T().points}">⭐ ${save.points}</span><span class="stat" title="${T().shards}">🐾 ${Math.min(save.shards, SHARDS_NEEDED)}/${SHARDS_NEEDED}</span>`;
function topbar(extra = "") {
  return `<div class="topbar"><div class="brand">${esc(T().name.replace("?", ""))}<span>?</span></div>
  <div class="row">${extra}${stats()}${langToggle()}</div></div>`;
}
const clock = m => { const t = 8 * 60 + m; return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
const dur = m => m % 60 ? tf("hoursMin", { h: Math.floor(m / 60), m: m % 60 }) : tf("hours", { h: m / 60 });

function personCard(c, pid) {
  const L = T();
  const talked = !!c.talked[pid];
  const active = c.said && c.said.pid === pid;
  let av, nm, role, tags = "", accuseBtn = "";
  if (pid.startsWith("res:")) {
    const r = LOC[pid.slice(4)].res;
    av = avatar(r); nm = nameOf(r); role = locName(pid.slice(4));
  } else if (pid === "__dog" || pid === "Snute") {
    av = avatar("Snute"); nm = "Snute"; role = L.dog;
    if (pid === "Snute" && talked) accuseBtn = `<button class="btn small danger" data-act="accuse" data-v="Snute">${L.accuse}</button>`;
  } else {
    av = avatar(pid); nm = pid; role = L.suspect;
    const o = c.outfits[pid];
    tags = talked
      ? `<div class="tags"><span class="t"><i class="sw" style="background:${HEX[o.c]}"></i>${esc(L.colors[o.c])}</span><span class="t">${esc(L.accs[o.a])}</span><span class="t">${esc(L.shoes[o.s])}</span></div>`
      : `<div class="tags"><span class="t">? ${esc(L.unknownLook)}</span></div>`;
    if (talked) accuseBtn = `<button class="btn small danger" data-act="accuse" data-v="${esc(pid)}">${L.accuse}</button>`;
  }
  return `<div class="person ${active ? "active" : ""}">
    <div class="who">${av}<div style="min-width:0"><div class="nm">${esc(nm)}</div><div class="role">${esc(role)}</div></div></div>
    ${tags}
    <div class="row"><button class="btn small ${talked ? "" : "primary"}" data-act="talk" data-v="${esc(pid)}">${talked ? L.again : `${L.talk} · ${talkCost()} min`}</button>${accuseBtn}</div>
  </div>`;
}

function gameView() {
  const L = T(), c = cur();
  const left = c.limit - c.time, pct = Math.max(0, left / c.limit * 100);
  const here = [`res:${c.loc}`, ...c.people[c.loc]];
  if (c.snute === c.loc) here.push("__dog");
  const speaker = c.said ? (c.said.pid.startsWith("res:") ? nameOf(LOC[c.said.pid.slice(4)].res) : c.said.pid === "__dog" ? "Snute" : c.said.pid) : "";
  const sniffLoc = perk() === "god" ? c.trail[Math.min(c.found.length, 4)] : null;
  const tiles = LOCS.map(l => `<button class="tile ${l === c.loc ? "here" : ""} ${l === sniffLoc ? "sniff" : ""}" data-act="travel" data-v="${l}" ${l === c.loc ? 'aria-current="true"' : ""} title="${l === sniffLoc ? esc(L.sniff) : ""}">
      <span class="ic" aria-hidden="true">${LOC[l].icon}</span><span class="n">${esc(locName(l))}${l === sniffLoc ? " 🐾" : ""}</span>
      <span class="c">${l === c.loc ? L.here : tf("walk", { n: walkCost() })}</span></button>`).join("");
  const found = c.found.slice().sort((a, b) => a - b);
  const notes = found.length ? found.map(i => {
    const p = trailLine(c, i);
    return `<div class="note"><b>${i + 1}</b><div>${p.map(x => esc(line(x))).join(" ")}</div></div>`;
  }).join("") : `<p class="perk" style="font-family:var(--f-body)">${esc(L.noHints)} (${esc(locName(c.trail[0]))})</p>`;

  return `${topbar(`<button class="btn small" data-act="home">${L.quit}</button>`)}
  <div class="panel gamehead">
    <div class="spread">
      <div><span class="label">${tf("caseN", { n: ui.run.idx + 1, m: ui.run.ids.length })} · ${ui.run.mode === "hard" ? L.hard : L.easy}</span>
        <h2>${CASES[c.id]} ${esc(L.cases[c.id].title)}</h2></div>
      <div style="text-align:right"><div class="clock">${clock(c.time)}</div><div class="perk">${dur(Math.max(0, left))} ${L.left}</div></div>
    </div>
    <div class="timebar ${pct < 25 ? "low" : ""}" role="progressbar" aria-valuemin="0" aria-valuemax="${c.limit}" aria-valuenow="${Math.max(0, left)}"><i style="width:${pct}%"></i></div>
  </div>
  ${ui.flash ? `<div class="flash ${ui.flash.ok ? "ok" : ""}">${esc(ui.flash.msg)}</div>` : ""}
  <div class="board">
    <div class="col">
      <div class="panel">
        <div class="roomhead"><div class="roomicon" aria-hidden="true">${LOC[c.loc].icon}</div>
          <div><span class="label">${L.youAreIn}</span><h2>${esc(locName(c.loc))}</h2></div></div>
        <div class="people">${here.map(p => personCard(c, p)).join("")}</div>
      </div>
      <div class="bubble ${c.said ? "" : "empty"}" aria-live="polite">
        ${c.said ? `<span class="spk">${esc(speaker)}</span><span>${c.said.parts.map(x => esc(line(x))).join(" ")}</span>` : `<span>${esc(L.tapTalk)}</span>`}
      </div>
    </div>
    <div class="col">
      <div class="panel"><h3>${L.mapTitle}</h3><div class="map">${tiles}</div></div>
      <div class="panel"><h3>📓 ${L.notebook}</h3><div class="notes">${notes}</div></div>
    </div>
  </div>`;
}

function resultView() {
  const L = T(), r = ui.result, c = cur();
  let body;
  if (r.ok) {
    body = `<span class="stamp">${L.solved}</span>
      <div class="me">${avatar(c.culprit, "lg")}<p style="font-size:1.15rem">${esc(c.culprit === "Snute" ? L.snuteWin : fill(L.cases[c.id].win, { name: c.culprit }))}</p></div>
      ${r.last ? `<h2>${L.runDone}</h2><p style="font-size:1.1rem">⭐ ${r.earned === 1 ? L.earned1 : tf("earnedN", { n: r.earned })}</p>
        <div class="row"><button class="btn primary" data-act="start" data-v="${ui.run.mode}">${L.retry}</button><button class="btn" data-act="chars">🎁 ${L.box}</button><button class="btn" data-act="home">${L.home}</button></div>`
      : `<div class="row"><button class="btn primary" data-act="next">${L.next} →</button><button class="btn" data-act="home">${L.quit}</button></div>`}`;
  } else {
    body = `<span class="stamp bad">${L.failed}</span><p style="font-size:1.15rem">${esc(r.msg)}</p>
      <div class="row"><button class="btn primary" data-act="start" data-v="${ui.run.mode}">${L.retry}</button><button class="btn" data-act="home">${L.home}</button></div>`;
  }
  return `${topbar()}<div class="panel casecard center">
    <span class="label">${tf("caseN", { n: ui.run.idx + 1, m: ui.run.ids.length })} · ${esc(L.cases[c.id].title)}</span>${body}</div>`;
}

const app = document.getElementById("app");
function render() {
  const v = { home: homeView, chars: charsView, intro: introView, game: gameView, result: resultView }[ui.screen] || homeView;
  app.innerHTML = v();
  if (ui.box) ui.box.shake = false;
}
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case "lang": setLang(v); break;
    case "start": startRun(v); break;
    case "go": ui.screen = "game"; render(); break;
    case "travel": travel(v); break;
    case "talk": talk(v); break;
    case "accuse": accuse(v); break;
    case "next": nextCase(); break;
    case "home": ui.screen = "home"; ui.run = null; ui.box = null; render(); break;
    case "chars": ui.screen = "chars"; ui.box = null; render(); break;
    case "box": openBox(); break;
    case "choose": choose(v); break;
  }
  if (["go", "next", "start"].includes(b.dataset.act)) window.scrollTo({ top: 0, behavior: "smooth" });
});

window.claude?.hot?.snapshot?.(() => ({ ui }));
function start(data) {
  if (data && data.ui) ui = data.ui;
  document.documentElement.lang = save.lang === "no" ? "no" : "en";
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
