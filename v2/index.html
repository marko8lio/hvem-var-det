  --admin: #7c3aed;
  --god: #c2187a;
  --shadow: 0 2px 0 #14213d;
  --f-display: "Bungee", "Arial Black", Impact, sans-serif;

    --common: #8f9bb8; --rare: #6b95ff; --legend: #f2b632; --mythic: #3fd2df; --admin: #a78bfa; --god: #ff4fb0; --shadow: 0 2px 0 #000;

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {

  color: var(--ink);

  font-size: 16px;

}
#app {

  margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: clamp(2.4rem, 8vw, 4.6rem); }
h2 { font-size: clamp(1.2rem, 3vw, 1.7rem); }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--rare); outline-offset: 2px; }

.stat { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-variant-numeric: tabular-nums; }

.tag { font-family: var(--f-note); font-size: 1.15rem; color: var(--muted); }

.mode .big { font-family: var(--f-display); font-size: 1.7rem; }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.how { display: grid; gap: 8px; margin: 12px 0 0; padding-left: 1.2em; }

.col { display: grid; gap: 16px; min-width: 0; }

.flash.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--paper)); }

.notes { display: grid; gap: 8px; margin-top: 10px; font-family: var(--f-note); }
.note { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }

.center { display: grid; gap: 16px; justify-items: start; max-width: 720px; }
.casecard { border-left: 8px solid var(--string); }

.box { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

// ---------- save ----------
// Characters that were renamed after the first release of v2.
const RENAMED = { "Oscar-hs": "Oscar HS", "Ms Alen": "Ms Allan" };
const STORE = "hvem-var-det-v2";
let save = { points: 0, shards: 0, owned: ["rookie"], selected: "rookie", lang: "en", admin: false, superSeen: false, pid: "", name: "" };
try {
  const s = JSON.parse(localStorage.getItem(STORE));
  if (s) save = Object.assign(save, s);
  else {
    // First visit to v2: bring points, shards and characters over from version 1.
    // Snute, Markus and Jonas are left behind because v2 has new rules for them.
    const old = JSON.parse(localStorage.getItem("hvem-var-det-v1"));
    if (old) {
      save.points = old.points || 0; save.shards = old.shards || 0; save.lang = old.lang || "en";
      save.owned = ["rookie", ...(old.owned || []).map(id => RENAMED[id] || id).filter(id => id !== "rookie" && !["Snute", "Markus", "Jonas"].includes(id) && CHARS.some(c => c.id === id))];
      if (save.owned.includes(RENAMED[old.selected] || old.selected)) save.selected = RENAMED[old.selected] || old.selected;
    }
  }
} catch (e) {}
const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(save)); } catch (e) {} };
save.owned = save.owned.map(id => RENAMED[id] || id);
save.selected = RENAMED[save.selected] || save.selected;
// A secret id per browser, so the leaderboard can add up one player's points. It is never shown.
if (!save.pid) {
  save.pid = window.crypto && crypto.randomUUID ? crypto.randomUUID()
    : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, ch => (ch ^ Math.random() * 16 >> ch / 4).toString(16));
  persist();
}
let ui = { screen: "home", run: null, result: null, flash: null, box: null };
let walking = false;

const T = () => TX[save.lang] || TX.en;
const nameOf = id => id === "rookie" ? T().rookie : (T().roles[id] || id);
const locName = l => T().loc[l];
function fill(s, p) {
  return s.replace(/\{(\w+)\}/g, (m, k) => {
    if (k === "color") return T().colors[p.color];
    if (k === "acc") return T().accs[p.acc];
    if (k === "shoes") return T().shoes[p.shoes];
    if (k === "loc") return locName(p.loc);
    if (k === "riddle") return T().riddle[p.loc];
    if (k === "name") return nameOf(p.name);
    if (p[k] !== undefined) return p[k];
    return m;
  });
}
const line = p => { let s = T().lines[p.k]; if (Array.isArray(s)) s = s[p.i % s.length]; return fill(s, p); };
const tf = (k, p = {}) => fill(T()[k], p);

const cur = () => ui.run && ui.run.c;
const isHard = () => ui.run && ui.run.mode === "hard";
const tier = () => rarityOf(save.selected);
const power = () => save.selected === "Snute" ? (save.shards >= SNUTE_SUPER ? "super" : "snute") : POWER[save.selected];
const talkCost = () => ["legendary", "mythic", "admin", "god"].includes(tier()) ? 5 : 10;
const walkCost = () => power() === "xray" ? 0 : tier() === "god" ? 2 : 5;
const attrPart = (pre, k, v) => ({ k: pre + "_" + k, [FIELD[k]]: v });

  const pts = route(c.loc, loc), segs = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); segs.push(d); total += d; }
  const dur = Math.max(400, total / (power() === "xray" ? 2.4 : 0.85));
  walking = true;
  el.closest("svg").classList.add("walking");
  const t0 = performance.now();
  const step = now => {
    let dist = Math.min(1, (now - t0) / dur) * total, i = 0;
    while (i < segs.length - 1 && dist > segs[i]) { dist -= segs[i]; i++; }
    const a = pts[i], b = pts[i + 1], f = segs[i] ? Math.min(1, dist / segs[i]) : 1;
    el.setAttribute("transform", figAt(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f));
    if (now - t0 < dur) requestAnimationFrame(step);
    else { walking = false; travel(loc); }
  };
  requestAnimationFrame(step);
}
function talk(pid) {
  const c = cur();
  ui.flash = null;
  if (c.talked[pid]) { c.said = { pid, parts: c.talked[pid] }; render(); return; }
  spend(talkCost());
  const rizz = power() === "rizz";
  let parts = [], tag = null;
  if (pid.startsWith("res:")) {
    const loc = pid.slice(4), i = c.trail.indexOf(loc);
    if (i >= 0 && i < 4) { parts.push(...trailLine(c, i)); tag = String(i + 1); }
    if (c.leftTo[loc]) { parts.push({ k: isHard() ? "moved_hard" : "moved_easy", loc: c.leftTo[loc] }); tag = tag || "➜"; }
    if (!parts.length && c.rumorLocs.includes(loc)) { parts.push(truthRumor(c, c.lie ? c.lie.k : KEYS[c.seeds[loc] % 3])); tag = "?"; }
    if (rizz) { parts.push(truthRumor(c, KEYS[c.seeds[loc] % 3])); tag = tag || "?"; }
    if (!parts.length) parts = [{ k: "noinfo", i: c.seeds[loc] }];
  } else if (pid === "__dog") {
    const n = power() === "shards2" ? 2 : 1;
    save.shards += n;
    parts = [{ k: n === 2 ? "snute2" : "snute", n: save.shards }];
    checkSnute(); persist();
  } else if (pid === "Snute") {
    parts = [{ k: "snuteGuilty" }];
  } else {
    if (pid === c.culprit || c.loc === c.trail[4]) parts.push({ k: "nervous", i: c.seeds[pid] });
    else if (!rizz && c.seeds[pid] % 3 !== 0) parts.push({ k: "chat", i: c.seeds[pid] });
    if (rizz || (!parts.length)) { parts.push(truthRumor(c, KEYS[(c.seeds[pid] / 3 | 0) % 3])); tag = "?"; }
  }
  c.talked[pid] = parts;
  c.said = { pid, parts };
  if (tag) c.notes.push({ tag, parts });
  after(); render();
}
function checkSnute() {
  if (save.shards >= SNUTE_UNLOCK && !save.owned.includes("Snute")) { save.owned.push("Snute"); ui.flash = { ok: true, msg: tf("snuteUnlocked") }; }
  if (save.shards >= SNUTE_SUPER && !save.superSeen) { save.superSeen = true; ui.flash = { ok: true, msg: tf("superUnlocked") }; }
}
function accuse(name) {
  const c = cur();
  if (name === c.culprit) {
    const last = ui.run.idx + 1 >= ui.run.ids.length;
    ui.run.total += c.time;
    ui.result = { ok: true, last };
    if (last) {
      const n = isHard() ? 2 : 1;
      save.points += n; persist();
      ui.result.earned = n;
      ui.result.minutes = ui.run.total;
      if (lbOn()) ui.result.pending = { mode: ui.run.mode, minutes: ui.run.total, character: save.selected };
    }
    ui.screen = "result";
    if (ui.result.pending && save.name) { submitRun(); return; }
  } else if (isHard()) {
    ui.result = { ok: false, msg: "wrongHard", name }; ui.screen = "result";
  } else {
    spend(30); ui.flash = { ok: false, msg: tf("wrongEasy", { name }) }; checkTime();
  }
  render();
}
function readMind(name) {

function openBox() {

}

const lbHeaders = () => ({ apikey: LB.key, Authorization: `Bearer ${LB.key}`, "Content-Type": "application/json" });
async function rpc(fn, body) {
  const r = await fetch(`${LB.url}/rest/v1/rpc/${fn}`, { method: "POST", headers: lbHeaders(), body: JSON.stringify(body) });
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.message || `HTTP ${r.status}`); }
}
async function lbGet(path) {
  const r = await fetch(`${LB.url}/rest/v1/${path}`, { headers: lbHeaders() });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
async function submitRun() {
  const res = ui.result, p = res && res.pending;
  if (!p || !save.name) return;
  res.lb = "saving"; render();
  try {
    await rpc("record_run", { p_id: save.pid, p_name: save.name, p_mode: p.mode, p_minutes: p.minutes, p_character: p.character });
    res.lb = "saved"; res.pending = null;
  } catch (e) { res.lb = "error"; res.lbErr = e.message; }
  render();
}
async function openLeaders() {
  ui.screen = "leaders"; ui.lb = { loading: true }; ui.lbTab = ui.lbTab || "points"; render();
  const fast = mode => `leaderboard_fastest?select=name,minutes,character&mode=eq.${mode}&order=minutes.asc,created_at.asc&limit=25`;
  try {
    const [points, easy, hard] = await Promise.all([
      lbGet("leaderboard_points?select=name,points&order=points.desc,updated_at.asc&limit=25"), lbGet(fast("easy")), lbGet(fast("hard")),
    ]);
    ui.lb = { points, easy, hard };
  } catch (e) { ui.lb = { error: true }; }
  if (ui.screen === "leaders") render();
}
async function saveName(name) {
  const clean = name.replace(/\s+/g, " ").trim().slice(0, 16);
  if (clean.length < 2) return;
  save.name = clean; persist();
  if (ui.screen === "result") { submitRun(); return; }
  try { await rpc("set_name", { p_id: save.pid, p_name: clean }); } catch (e) {}
  openLeaders();
}

  return `${topbar(`<button class="btn small" data-act="home">${L.quit}</button>`)}
  <div class="panel gamehead">
    <div class="spread">
      <div><span class="label">${tf("caseN", { n: ui.run.idx + 1, m: ui.run.ids.length })} · ${isHard() ? L.hard : L.easy}</span>
        <h2>${CASES[c.id]} ${esc(L.cases[c.id].title)}</h2></div>
      <div class="row">${avatar(save.selected)}<div style="text-align:right"><div class="clock">${clock(c.time)}</div><div class="perk">${dur(Math.max(0, left))} ${L.left}</div></div></div>
    </div>
    <div class="timebar ${pct < 25 ? "low" : ""}" role="progressbar" aria-valuemin="0" aria-valuemax="${c.limit}" aria-valuenow="${Math.max(0, left)}"><i style="width:${pct}%"></i></div>
  </div>
  ${ui.flash ? `<div class="flash ${ui.flash.ok ? "ok" : ui.flash.info ? "info" : ""}">${esc(ui.flash.msg)}</div>` : ""}
  <div class="board">
    <div class="panel" style="padding:10px">
      <div class="mapwrap">${mapSvg(c)}</div>
      <p class="maphint">${esc(L.mapHint)}</p>
    </div>
    <div class="col">
      <div class="bubble ${c.said ? "" : "empty"}" aria-live="polite">
        ${c.said ? `<span class="spk">${esc(speaker)}</span><span>${c.said.parts.map(x => esc(line(x))).join(" ")}</span>` : `<span>${esc(L.tapTalk)}</span>`}
      </div>
      <div class="panel" style="display:grid;gap:12px">
        <div class="roomhead"><div class="roomicon" aria-hidden="true">${LOC[c.loc].icon}</div>
          <div><span class="label">${L.youAreIn}</span><h2>${esc(locName(c.loc))}</h2></div></div>
        <div class="people">${here.map(p => personCard(c, p)).join("")}</div>
      </div>
      <div class="panel"><h3>📓 ${L.notebook}</h3><div class="notes">${notes}</div></div>
    </div>
  </div>`;
}

function nameForm(btnLabel) {
  const L = T();
  return `<form class="nameform" data-form="name">
    <label for="lbname" class="label">${L.lbName}</label>
    <div class="row"><input id="lbname" name="lbname" maxlength="16" minlength="2" required autocomplete="nickname" value="${esc(save.name)}">
    <button class="btn primary" type="submit">${btnLabel}</button></div>
    <span class="perk">${esc(L.lbNameHint)}</span></form>`;
}
function lbResult(r) {
  const L = T();
  if (!lbOn() || (!r.pending && !r.lb)) return "";
  if (r.lb === "saving") return `<p class="perk">${L.lbSaving}</p>`;
  if (r.lb === "saved") return `<div class="row"><span class="flash ok">🏆 ${L.lbSaved}</span><button class="btn" data-act="leaders">${L.leaders}</button></div>`;
  if (r.lb === "error") return `<div class="row"><span class="flash">${esc(tf("lbSaveErr", { msg: r.lbErr }))}</span><button class="btn" data-act="lbsubmit">${L.lbRetry}</button></div>`;
  return nameForm(L.lbSave);
}

function leadersView() {
  const L = T(), lb = ui.lb || {}, tab = ui.lbTab;
  const tabs = [["points", L.lbPoints], ["easy", L.lbEasy], ["hard", L.lbHard]].map(([k, label]) =>
    `<button class="tab" role="tab" aria-selected="${tab === k}" data-act="lbtab" data-v="${k}">${label}</button>`).join("");
  let body;
  if (lb.loading) body = `<p class="perk">${L.lbLoading}</p>`;
  else if (lb.error) body = `<div class="row"><span class="flash">${esc(L.lbError)}</span><button class="btn" data-act="leaders">${L.lbRetry}</button></div>`;
  else {
    const rows = lb[tab] || [];
    if (!rows.length) body = `<p class="perk">${esc(L.lbEmpty)}</p>`;
    else {
      const head = tab === "points" ? `<th>${L.colPoints}</th>` : `<th>${L.colTime}</th><th>${L.colChar}</th>`;
      body = `<div class="tablewrap"><table class="lbtable"><thead><tr><th>#</th><th>${L.colName}</th>${head}</tr></thead><tbody>${rows.map((x, i) => {
        const me = save.name && x.name === save.name;
        const cells = tab === "points" ? `<td class="num">⭐ ${x.points}</td>` : `<td class="num">${esc(dur(x.minutes))}</td><td>${esc(x.character ? nameOf(x.character) : "")}</td>`;
        return `<tr class="${me ? "mine" : ""}"><td class="num">${i < 3 ? ["🥇", "🥈", "🥉"][i] : i + 1}</td><td>${esc(x.name)}${me ? ` <span class="label">(${L.lbYou})</span>` : ""}</td>${cells}</tr>`;
      }).join("")}</tbody></table></div>${tab === "points" ? "" : `<p class="perk">${esc(L.lbFastNote)}</p>`}`;
    }
  }
  return `${topbar(`<button class="btn small" data-act="home">← ${L.back}</button>`)}
  <div class="panel" style="display:grid;gap:16px">
    <h2>🏆 ${L.leaders}</h2>
    <div class="tabs" role="tablist">${tabs}</div>
    ${body}
  </div>
  <div class="panel">${nameForm(L.lbChange)}</div>`;
}

function resultView() {
  const L = T(), r = ui.result, c = cur();
  let body;
  if (r.ok) {
    const win = c.culprit === "Snute" ? L.snuteWin : fill(L.cases[c.id].win, { name: c.culprit });
    body = `<span class="stamp">${L.solved}</span>
      <div class="me"><div class="av lg r-${rarityOf(c.culprit)}">${figSvg(c.culprit === "Snute" ? { kind: "dog" } : { kind: "kid", name: c.culprit, o: c.outfits[c.culprit] }, 52)}</div><p style="font-size:1.15rem">${esc(win)}</p></div>
      ${r.last ? `<h2>${L.runDone}</h2><p style="font-size:1.1rem">⭐ ${r.earned === 1 ? L.earned1 : tf("earnedN", { n: r.earned })} · ⏱ ${esc(tf("playTime", { t: dur(r.minutes) }))}</p>
        ${lbResult(r)}
        <div class="row"><button class="btn primary" data-act="start" data-v="${ui.run.mode}">${L.retry}</button><button class="btn" data-act="chars">🎁 ${L.box}</button><button class="btn" data-act="home">${L.home}</button></div>`
      : `<div class="row"><button class="btn primary" data-act="next">${L.next} →</button><button class="btn" data-act="home">${L.quit}</button></div>`}`;
  } else {
    body = `<span class="stamp bad">${L.failed}</span><p style="font-size:1.15rem">${esc(tf(r.msg, { name: r.name || "" }))}</p>
      <div class="row"><button class="btn primary" data-act="start" data-v="${ui.run.mode}">${L.retry}</button><button class="btn" data-act="home">${L.home}</button></div>`;
  }
  return `${topbar()}<div class="panel casecard center">
    <span class="label">${tf("caseN", { n: ui.run.idx + 1, m: ui.run.ids.length })} · ${esc(L.cases[c.id].title)}</span>${body}</div>`;
}

const app = document.getElementById("app");
function render() {
  const v = { home: homeView, chars: charsView, intro: introView, game: gameView, result: resultView, leaders: leadersView }[ui.screen] || homeView;
  app.innerHTML = v();
  if (ui.box) ui.box.shake = false;
}
function act(el) {
  const v = el.dataset.v;
  switch (el.dataset.act) {
    case "lang": setLang(v); break;
    case "start": startRun(v); break;
    case "go": ui.screen = "game"; render(); break;
    case "travel": walkTo(v); break;
    case "talk": talk(v); break;
    case "accuse": accuse(v); break;
    case "mind": readMind(v); break;
    case "secret": secretClick(); break;
    case "godbit": eatGodbit(); break;
    case "next": nextCase(); break;
    case "home": ui.screen = "home"; ui.run = null; ui.box = null; render(); break;
    case "chars": ui.screen = "chars"; ui.box = null; render(); break;
    case "box": openBox(); break;
    case "choose": choose(v); break;
    case "leaders": openLeaders(); break;
    case "lbtab": ui.lbTab = v; render(); break;
    case "lbsubmit": submitRun(); break;
  }
  if (["go", "next", "start"].includes(el.dataset.act)) window.scrollTo({ top: 0, behavior: "smooth" });
}
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled || walking) return;
  act(el);
});
app.addEventListener("submit", e => {
  e.preventDefault();
  const input = e.target.querySelector("#lbname");
  if (input) saveName(input.value);
});
app.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest && e.target.closest(".rm[data-act]");
  if (!el || walking) return;
  e.preventDefault();
  act(el);
});

if (window.__TEST__) window.__TEST__.get = () => ({ ui, save, act: (a, v) => act({ dataset: { act: a, v } }) });
window.claude?.hot?.snapshot?.(() => ({ ui }));
function start(data) {
  if (data && data.ui) ui = data.ui;
  document.documentElement.lang = save.lang === "no" ? "no" : "en";
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
